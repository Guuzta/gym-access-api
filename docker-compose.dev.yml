services:
  api:
    build: .
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env.development
    ports:
      - "3000:3000"

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:
